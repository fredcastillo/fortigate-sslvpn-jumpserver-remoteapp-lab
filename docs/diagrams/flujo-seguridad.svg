<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Flujo físico y seguridad — FortiGate SSL-VPN, Jump Server y RemoteApp</title>
<desc id="desc">La LAN de usuarios incluye CLIENTE-FORTICLIENT y BROWSER-PC conectados a Switch-A VLAN 10. Switch-A conecta a R1-CISCO, luego al Router-ISP y finalmente a FortiGate port1. El overlay SSL-VPN termina en FortiGate. El tráfico SSL-VPN autorizado se reenvía desde ssl.root a port3 hacia Jump Server. Desde Jump Server, FortiGate controla las conexiones port3 a port2 hacia Web Server.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#11263b"/></linearGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#76b8ed"/></marker>
  <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff566e"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .title{font-size:29px;font-weight:750;fill:#f4f7ff}
    .subtitle{font-size:15px;fill:#9cb2d1}
    .h{font-size:17px;font-weight:750;fill:#f2f6ff}
    .body{font-size:13px;fill:#cbd9ed}
    .small{font-size:11.5px;fill:#9eb5d3}
    .tiny{font-size:10.5px;fill:#8ca6c7}
    .card{fill:#13243a;stroke:#476589;stroke-width:1.4}
    .red{fill:#351c2a;stroke:#ff566e;stroke-width:1.5}
    .blue{fill:#123451;stroke:#49b9ee;stroke-width:1.5}
    .line{fill:none;stroke:#76b8ed;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .vpn{fill:none;stroke:#ff566e;stroke-width:3.1;stroke-dasharray:9 7;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1600" height="960" rx="24" fill="url(#bg)"/>
<text x="44" y="52" class="title">Flujo de acceso y controles de seguridad</text>
<text x="44" y="81" class="subtitle">Separamos el camino físico (underlay) del túnel VPN (overlay) y de las políticas entre servidores.</text>

<!-- Underlay lane -->
<rect x="38" y="115" width="1524" height="278" rx="18" fill="#0b1a2b" stroke="#344e6d" stroke-width="1.3"/>
<text x="62" y="151" class="h">1 · UNDERLAY — camino de red hasta el listener SSL-VPN</text>

<!-- nodes -->
<rect x="60" y="210" width="235" height="118" rx="12" class="red"/>
<text x="78" y="239" class="h">LAN USUARIOS</text><text x="78" y="264" class="body">VLAN 10 · 10.21.75.0/25</text><text x="78" y="286" class="small">CLIENTE-FORTICLIENT · .10</text><text x="78" y="306" class="small">BROWSER-PC · .110 (estática</text><text x="78" y="320" class="small">en la instancia referenciada)</text>
<rect x="330" y="225" width="155" height="88" rx="11" class="card"/>
<text x="407" y="253" class="h" text-anchor="middle">Switch-A</text><text x="407" y="276" class="body" text-anchor="middle">VLAN 10</text><text x="407" y="296" class="small" text-anchor="middle">Capa 2</text>
<rect x="520" y="210" width="190" height="118" rx="11" class="card"/>
<text x="615" y="239" class="h" text-anchor="middle">R1-CISCO</text><text x="615" y="265" class="body" text-anchor="middle">LAN .1/25</text><text x="615" y="287" class="body" text-anchor="middle">WAN .21/30</text><text x="615" y="309" class="small" text-anchor="middle">Gateway · DHCP · routing</text>
<rect x="745" y="210" width="190" height="118" rx="11" class="card"/>
<text x="840" y="239" class="h" text-anchor="middle">Router-ISP</text><text x="840" y="265" class="body" text-anchor="middle">lado R1 · .22/30</text><text x="840" y="287" class="body" text-anchor="middle">lado FG · .25/30</text><text x="840" y="309" class="small" text-anchor="middle">Tránsito simulado</text>
<rect x="970" y="210" width="225" height="118" rx="11" class="red"/>
<text x="1082" y="239" class="h" text-anchor="middle">FortiGate port1</text><text x="1082" y="265" class="body" text-anchor="middle">203.0.113.26/30</text><text x="1082" y="287" class="body" text-anchor="middle">SSL-VPN TCP/10443</text><text x="1082" y="309" class="small" text-anchor="middle">Autenticación / descifrado</text>
<path d="M295 270 H330 M485 270 H520 M710 270 H745 M935 270 H970" class="line" marker-end="url(#arr)"/>
<text x="487" y="205" class="tiny" text-anchor="middle">VLAN 10</text>
<text x="483" y="347" class="tiny" text-anchor="middle">Enlace switch ↔ R1</text>
<!-- Overlay arc -->
<path d="M150 213 C340 184 760 184 1010 213" class="vpn" marker-end="url(#arrRed)"/>
<rect x="405" y="177" width="375" height="27" rx="8" fill="#321b29" stroke="#ff566e"/>
<text x="592" y="195" class="small" text-anchor="middle" style="fill:#ffdce3;font-weight:750">OVERLAY SSL-VPN: CLIENTE → FORTIGATE</text>
<text x="62" y="370" class="tiny">Nota: 203.0.113.0/24 es TEST-NET-3 de documentación; se utiliza aquí como WAN simulada en GNS3.</text>

<!-- Overlay flow -->
<rect x="38" y="420" width="1524" height="208" rx="18" fill="#0b1a2b" stroke="#344e6d" stroke-width="1.3"/>
<text x="62" y="456" class="h">2 · OVERLAY — tráfico interno tras autenticar y descifrar SSL-VPN</text>
<rect x="65" y="485" width="285" height="102" rx="11" class="red"/>
<text x="84" y="514" class="h">Cliente VPN</text><text x="84" y="539" class="body">IP del pool: 10.212.134.200</text><text x="84" y="560" class="small">Interfaz lógica cliente: ppp0</text>
<rect x="440" y="485" width="300" height="102" rx="11" class="card"/>
<text x="460" y="514" class="h">FortiGate · ssl.root</text><text x="460" y="539" class="body">Policy SSLVPN_TO_JUMP_HTTPS</text><text x="460" y="560" class="small">Destino JUMP_SERVER · servicio HTTPS</text>
<rect x="830" y="485" width="300" height="102" rx="11" class="blue"/>
<text x="850" y="514" class="h">FortiGate · port3</text><text x="850" y="539" class="body">Jump LAN · 10.21.75.136/29</text><text x="850" y="560" class="small">Gateway 10.21.75.137</text>
<rect x="1220" y="485" width="300" height="102" rx="11" class="blue"/>
<text x="1240" y="514" class="h">JUMP-SRV</text><text x="1240" y="539" class="body">10.21.75.138/29 · HTTPS/443</text><text x="1240" y="560" class="small">RD Web / RemoteApp por roles</text>
<path d="M350 536 H440 M740 536 H830 M1130 536 H1220" class="line" marker-end="url(#arr)"/>
<text x="390" y="519" class="tiny" text-anchor="middle">VPN</text><text x="785" y="519" class="tiny" text-anchor="middle">política</text><text x="1175" y="519" class="tiny" text-anchor="middle">HTTPS</text>
<text x="62" y="609" class="tiny">DNS utiliza la política SSLVPN_TO_JUMP_DNS solo si el destino configurado presta DNS y el cliente lo consulta.</text>

<!-- Jump to Web -->
<rect x="38" y="655" width="1524" height="254" rx="18" fill="#0b1a2b" stroke="#344e6d" stroke-width="1.3"/>
<text x="62" y="692" class="h">3 · Jump Server → Web Server — mínimo privilegio entre LAN separadas</text>
<rect x="65" y="722" width="300" height="113" rx="11" class="blue"/>
<text x="85" y="751" class="h">JUMP-SRV</text><text x="85" y="776" class="body">Gateway 10.21.75.137</text><text x="85" y="798" class="small">Origen de conexiones permitidas</text>
<rect x="465" y="722" width="285" height="113" rx="11" class="card"/>
<text x="485" y="751" class="h">FortiGate</text><text x="485" y="776" class="body">port3 → port2</text><text x="485" y="798" class="small">Evaluación de políticas</text>
<rect x="850" y="722" width="300" height="113" rx="11" class="blue"/>
<text x="870" y="751" class="h">WEB-SERVER</text><text x="870" y="776" class="body">10.21.75.130/29</text><text x="870" y="798" class="small">Gateway 10.21.75.129</text>
<path d="M365 778 H465 M750 778 H850" class="line" marker-end="url(#arr)"/>
<rect x="1200" y="720" width="322" height="57" rx="10" fill="#123b35" stroke="#45d6a0" stroke-width="1.4"/>
<text x="1220" y="744" class="h" style="font-size:15px;fill:#bbffe4">PERMITIR</text><text x="1220" y="764" class="body" style="font-size:10.8px">TCP/443 HTTPS · TCP/3389 RDP · TCP/22 SSH</text>
<rect x="1200" y="790" width="322" height="57" rx="10" fill="#3a202a" stroke="#ff566e" stroke-width="1.4"/>
<text x="1220" y="814" class="h" style="font-size:15px;fill:#ffdce3">DENEGAR</text><text x="1220" y="834" class="body">Los demás servicios entre estos hosts</text>
<text x="62" y="878" class="small">`JUMP_TO_WEBSERVER_P4` primero; `JUMP_TO_WEB_DENY_OTHER` debajo. La prueba debe correlacionar conexión y logs.</text>
<text x="44" y="938" class="subtitle">Los enlaces físicos, el túnel SSL-VPN y los flujos internos son capas diferentes y se documentan por separado.</text>
</svg>
